[package]
name = "herdr-notifications"
version = "0.3.0"
edition = "2024"
description = "Rich native OS desktop notifications for herdr agent-status events (Linux, macOS, Windows, BSD), with zero-LLM context enrichment and click-to-focus."
license = "MIT"
repository = "https://github.com/liamwh/herdr-rich-notifications"
readme = "README.md"
keywords = ["herdr", "notifications", "plugin", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "herdr-notifications"
path = "src/main.rs"

[dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
